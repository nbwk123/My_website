site_name: Kai Wang
site_description: Kai Wang's personal website for learning notes, projects, writing, and design practice.
site_url: https://nbwk123.github.io/My_website/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/avatar-kai.png
  favicon: assets/avatar-kai.png
  palette:
    scheme: default
    primary: white
    accent: black
  font:
    text: Noto Sans SC
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate

nav:
  - Home: index.md
  - Courses: course/index.md
  - Projects: project/index.md
  - Personal Website System: project/website-system.md
  - COSTORY: project/costory.md
  - Blog: blogs/index.md
  - 2024 D20 Global Design Deans Summit: blogs/2024D20.md
  - Japan · Osaka · Kyoto: blogs/Japan-travel.md
  - About: about/index.md
  - 中文:
      - 主页: zh/index.md
      - 课程: zh/course/index.md
      - 项目: zh/project/index.md
      - 个人网站系统: zh/project/website-system.md
      - COSTORY: zh/project/costory.md
      - 博客: zh/blogs/index.md
      - D20全球设计院长峰会: zh/blogs/2024D20.md
      - 日本·大阪·京都: zh/blogs/Japan-travel.md
      - 关于: zh/about/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/interactions.js
