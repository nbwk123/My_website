site_name: Kai Wang
site_description: Kai Wang 的个人网站，记录学习、项目、作品与思考等。
site_url: https://nbwk123.github.io/My_website/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/avatar-kai.png
  favicon: assets/avatar-kai.png
  palette:
    scheme: default
    primary: white
    accent: black
  font:
    text: Noto Sans SC
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate

nav:
  - 主页: index.md
  - 课程: course/index.md
  - 项目: project/index.md
  - 个人网站系统: project/website-system.md
  - COSTORY: project/costory.md
  - 博客: blogs/index.md
  - D20全球设计院长峰会: blogs/2024D20.md
  - 关于: about/index.md
  - English:
      - Home: en/index.md
      - Notes: en/course/index.md
      - Sample Note: en/course/example.md
      - Projects: en/project/index.md
      - Personal Website System: en/project/website-system.md
      - COSTORY: en/project/costory.md
      - Links: en/friends/index.md
      - About: en/about/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/interactions.js
